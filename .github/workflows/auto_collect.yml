name: Auto Collect Proxies

on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collect script
        timeout-minutes: 10
        env:
          GIST_LINK: ${{ secrets.GIST_LINK }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python subscribe/collect.py -g "$GIST_LINK" -k "$GIST_TOKEN" -t clash v2ray -p 3 -c -n 128
